# Example Plasma Installer profile.
#
# This is intentionally simple for the first version. The installer can
# eventually parse this into activity definitions and KDE settings.

PROFILE_NAME="workstation"

ACTIVITIES=(
    "Work"
    "Personal"
    "Gaming"
)

# Future examples:
#
# [activity.Work]
# wallpaper=...
# applications=...
#
# [settings]
# dark_mode=true
# panel_position=bottom
